backend:
  name: github
  repo: YoucefSennoun/mahbb40jijel
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "news"
    label: "News"
    folder: "data/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Image", name: "image", widget: "image", required: false}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "announcements"
    label: "Homepage Announcements"
    files:
      - label: "Announcements"
        name: "announcements"
        file: "data/announcements.json"
        fields:
          - label: "Announcements List"
            name: "items"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Badge", name: "badge", widget: "string", default: "إعلان"}
              - {label: "Date / Meta", name: "date", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
